# Runs the regression suite (tests/) on every pull request and every push to main.
# Chromium runs everything; Firefox and WebKit (Safari's engine) run the cross-browser suites;
# iPhone, iPad and Pixel emulation run the @mobile tests. Lighthouse CI checks the Core Web Vitals.
# Each browser's tests are split into shards, one job each, run at the same time (2026-11-01: a run took 15
# minutes, the Chromium job alone; twelve jobs plus lint and Lighthouse stay under the 20 jobs a free account runs
# at once).
# The site itself is not built: these jobs only test the files as Cloudflare Pages serves them.
#
# The tests run inside Playwright's own Docker image, so the browsers and system fonts are the same on
# every run. Screenshots and printed page counts taken there are kept under __snapshots__/**/ci/
# (see update-snapshots.yml for how they are made).
name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# A new push to a pull request cancels that pull request's run still going, so a run of quick pushes doesn't
# queue a full run for each (they share the account's limit on jobs at once). Runs on main are never cancelled.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Type checks (files marked // @ts-check) and the logic tests in tests/unit (Vitest)
      - run: npm run types
      - run: npm run unit
  playwright:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      # Keep in step with @playwright/test in tests/package.json
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    strategy:
      fail-fast: false
      matrix:
        # (sized to what each engine runs, tests/playwright.config.mjs: Chromium every suite, 653 tests; WebKit the
        # drawing and the reading flows, 258; the iPhone every phone test, 172; Firefox the drawing, 112; the iPad
        # and Pixel 97. 2026-11-11)
        include:
          - { projects: chromium, shard: 1/4 }
          - { projects: chromium, shard: 2/4 }
          - { projects: chromium, shard: 3/4 }
          - { projects: chromium, shard: 4/4 }
          - { projects: webkit, shard: 1/2 }
          - { projects: webkit, shard: 2/2 }
          - { projects: iphone, shard: 1/1 }
          - { projects: firefox, shard: 1/1 }
          - { projects: "ipad,pixel", shard: 1/1 }
    defaults:
      run:
        working-directory: tests
    env:
      CI: "1"
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - run: npx playwright test --shard=${{ matrix.shard }}
        env:
          PW_PROJECTS: ${{ matrix.projects }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: |
            tests/playwright-report/
            tests/test-results/
          retention-days: 1
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - run: npx lhci autorun
