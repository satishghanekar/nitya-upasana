<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mockup · Today B · Family first</title>
<link rel="stylesheet" href="mock.css">
<style>
  main { max-width: 640px; margin: 0 auto; padding: 12px 14px 150px; display: grid; gap: 14px; }
  .fam { display: flex; gap: 14px; overflow-x: auto; padding: 4px 2px 2px; }
  .fam button { border: 0; background: none; display: grid; justify-items: center; gap: 4px; font-size: 13px; color: var(--muted); min-width: 56px; }
  .fam .av { width: 56px; height: 56px; font: 600 15px var(--body); }
  .fam .on { color: var(--ink); font-weight: 650; }
  .fam .on .av { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--accent); }
  .fam .add .av { background: var(--surface); color: var(--muted); border: 2px dashed var(--line); }
  .hd { display: flex; align-items: center; justify-content: space-between; }
  .hd h1 { margin: 0; font: 600 20px var(--ui); }
  .spl { padding: 8px 12px; }
  .sticky { position: fixed; left: 0; right: 0; bottom: 61px; padding: 10px 14px; background: linear-gradient(transparent, var(--bg) 30%); }
  .sticky .btn { width: 100%; max-width: 612px; margin: 0 auto; display: flex; }
  .preview { display: none; }
  @media (min-width: 1000px) {
    #app { display: grid; grid-template-columns: 440px 1fr; }
    .top { grid-column: 1 / -1; }
    main { padding: 18px 22px 40px; border-right: 1px solid var(--rule); }
    .sticky { position: static; padding: 0; background: none; }
    .bb { display: none; }
    .preview { display: block; padding: 34px 40px; text-align: center; }
    .preview h2 { font: 28px var(--head); color: var(--accent); margin: 0 0 4px; }
    .preview .v p { margin: 6px 0; font: 26px/1.6 var(--body); }
    .preview .lab { font-size: 13px; color: var(--muted); margin-top: 20px; }
    .preview .rf { border-left: 2px solid var(--gold); display: inline-block; padding-left: 16px; text-align: center; }
  }
</style>
</head>
<body>
<div id="app"></div>
<span class="mk">Option B · Family first</span>
<script src="../tests/unit/fixtures/pieces.js"></script>
<script src="mock.js"></script>
<script>
document.getElementById("app").innerHTML =
  topbar() + "<main>" +
  '<div class="fam" role="radiogroup" aria-label="Who is praying">' + PEOPLE.map(function (p, i) {
    return '<button role="radio" aria-checked="' + (i === 1) + '" class="' + (i === 1 ? "on" : "") + '"><span class="av" style="--c:' + p.c + '">' + p.d + "</span>" + p.n + "</button>";
  }).join("") + '<button class="add"><span class="av">' + I.plus + "</span>Add</button></div>" +
  '<div class="hd"><h1>Sunday, 18 Oct</h1><span class="tag sp">Sankashti in 10 days</span></div>' +
  week("Sun") + seg("Evening") +
  '<div class="lbl">Baba’s evening · 10 texts · 2 done</div>' +
  rows(EVENING, [1, 2], { tag: true }) +
  '<div class="sticky"><button class="btn">' + I.play + "Start · 8 texts left</button></div>" +
  "</main>" +
  '<section class="preview" aria-label="Next text"><div class="lbl">Up next · 3 of 10</div><h2>देवीची आरती</h2><div class="muted">Devi Aarti</div>' +
  '<div class="lab">ध्रुपद</div><div class="rf v">' + piece(3).refrain.lines.map(function (l) { return "<p>" + l.mr + "</p>"; }).join("") + '</div>' +
  '<div class="v" style="margin-top:22px">' + piece(3).items[0].lines.map(function (l) { return "<p>" + l.mr + "</p>"; }).join("") + "</div></section>" +
  '<nav class="bb"><button class="ib">' + I.app + '</button><button class="ib">' + I.share + '</button><button class="ib">' + I.print + '</button><button class="ib">' + I.help + "</button></nav>";
</script>
</body>
</html>
