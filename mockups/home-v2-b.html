<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mockup · Home v2 B · Focus</title>
<link rel="stylesheet" href="mock.css">
<style>
  main { max-width: 560px; margin: 0 auto; padding: 18px 14px 40px; display: grid; gap: 16px; justify-items: center; text-align: center; }
  .d1 { font: 24px/1.25 var(--head); margin-top: 4px; }
  .d2 { color: var(--muted); font-size: 13.5px; margin-top: -10px; }
  .tithi { font: 20px/1.3 var(--head); color: var(--accent); margin-top: -4px; }
  .tsub { font: 14px var(--body); margin-top: -12px; }
  .sun { display: flex; gap: 16px; font-size: 13px; color: var(--muted); margin-top: -8px; }
  .sun span { display: inline-flex; align-items: center; gap: 4px; }
  .cl { font-size: 14px; color: var(--accent); display: inline-flex; align-items: center; gap: 4px; text-decoration: none; margin-top: -8px; }
  .now { width: 100%; padding: 18px 16px; display: grid; gap: 12px; border-top: 3px solid var(--accent); }
  .now .lbl { margin: 0; }
  .now h2 { margin: 0; font: 26px/1.3 var(--head); color: var(--accent); }
  .now .nx { font: 18px/1.35 var(--head); }
  .bar { height: 8px; border-radius: 4px; background: var(--surface); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 20%; background: var(--tick); }
  .now .btn { min-height: 58px; font-size: 18px; }
  details { width: 100%; text-align: left; }
  summary { cursor: pointer; padding: 10px 4px; color: var(--accent); font-weight: 600; text-align: center; }
</style>
</head>
<body>
<div id="app"></div>
<span class="mk">Option B · Focus</span>
<script src="mock.js"></script>
<script src="home-v2.js"></script>
<script>
loadEvening().then(function (L) {
  document.getElementById("app").innerHTML = topbar2() + "<main>" + pic(150) +
    '<div class="d1">' + PAN.vara.mr + ", " + PAN.dateMr + '</div><div class="d2">' + PAN.vara.en + ", " + PAN.dateEn + "</div>" +
    '<div class="tithi">' + PAN.masa.mr + " " + PAN.paksha.mr + " " + PAN.tithi.mr + '</div><div class="tsub">नक्षत्र ' + PAN.nak.mr + "</div>" +
    '<div class="sun"><span>' + I.sunUp + PAN.sunrise + "</span><span>" + I.sunDn + PAN.sunset + "</span></div>" +
    '<a class="cl" href="#">' + I.cal + "Vedic calendar" + "</a>" +
    '<section class="card now" aria-label="Evening"><p class="lbl">सायंकाळ · Evening · 2 of ' + L.length + " done</p>" +
      '<div class="bar" role="img" aria-label="2 of ' + L.length + ' done"><i></i></div>' +
      '<div class="nx">Next: ' + L[2].title + "</div>" +
      '<button class="btn">' + I.play + "Start</button></section>" +
    '<details><summary>See all ' + L.length + " texts</summary>" + trows(L, 2) + "</details>" +
    "</main>";
});
</script>
</body>
</html>
